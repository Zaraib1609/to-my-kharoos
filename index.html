<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To My Kharoos ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #ffe6ee, #fff5f8);
      color: #5a3040;
      overflow: hidden;
    }

    .container {
      padding: 30px;
      max-width: 600px;
    }

    .heart {
      font-size: 55px;
      animation: heartbeat 1.5s infinite;
    }

    h1 {
      font-size: 42px;
      margin: 15px 0;
    }

    p {
      font-size: 20px;
      line-height: 1.7;
    }

    button {
      margin-top: 20px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: #d96b8a;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    .floating-heart {
      position: absolute;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }

    @keyframes float {
      from {
        transform: translateY(100vh);
      }
      to {
        transform: translateY(-100px);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="heart">❤️</div>

    <h1>Hey Kharoos... 👀</h1>

    <p>
      I made something for you... 🥹❤️
    </p>

    <p>
      I know you're miles away right now,
      but for a little while...
      come a little closer. 🤍
    </p>

    <button onclick="startSurprise()">
      Open your surprise 🎁
    </button>

  </div>

  <script>
    function startSurprise() {
      alert("Okay Kharoos... the surprise is just getting started. 😂❤️");
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.innerHTML = "❤️";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    setInterval(createHeart, 700);
  </script>

</body>
</html>
